<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>業務管理ポータル</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box} body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f6f8;color:#111}
header{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid #ddd;z-index:2}
h1{font-size:20px;margin:0} .wrap{padding:14px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px} button{font-size:16px;padding:14px;border:1px solid #ccc;border-radius:12px;background:#fff}
button.primary{background:#111;color:#fff} input{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:10px;font-size:16px}
.small{font-size:13px;color:#666} .num{font-size:26px;font-weight:700} table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 5px;border-bottom:1px solid #eee;text-align:left} .hidden{display:none} .tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}
.tabs button{white-space:nowrap;padding:9px 12px;font-size:14px} .warn{background:#fff7dc} .ok{background:#eef9ef}
</style>
</head>
<body>
<header><h1>業務管理ポータル</h1><div id="user" class="small"></div></header>
<div class="wrap">
<section id="login" class="card">
<h2>ログイン</h2><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード">
<button class="primary" onclick="login()">ログイン</button><div id="loginmsg" class="small"></div>
</section>
<section id="app" class="hidden">
<div class="card"><div class="grid">
<div><div class="small">実在庫</div><div id="physical" class="num">-</div></div>
<div><div class="small">予約在庫</div><div id="reserved" class="num">-</div></div>
<div><div class="small">出荷可能</div><div id="available" class="num">-</div></div>
<div><div class="small">商品数</div><div id="productCount" class="num">-</div></div>
</div><div class="small" id="synced"></div></div>
<div class="tabs">
<button onclick="show('quotes')">見積閲覧</button><button onclick="show('inventory')">商品・在庫</button><button onclick="show('receipt')">入庫登録</button><button onclick="show('moves')">入出庫履歴</button>
<button onclick="show('shipmentNew')">新規出荷依頼</button><button onclick="show('shipments')">出荷依頼一覧</button><button onclick="show('transport')">運送依頼</button>
<button onclick="show('warehouses')">営業倉庫</button>
</div>
<div id="content" class="card">読み込み中...</div>
<div class="card small">通信量対策：必要な列だけ取得し、履歴は最新50件を基本表示します。PDFは自動取得しません。</div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://crltrozxztivkyxtjjxv.supabase.co","sb_publishable_znOVYKMnJiZuxrsXPaLPxA_EbUdenvN");
let D={products:[],balances:[],moves:[],shipments:[],transport:[],warehouses:[]};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function login(){
 const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error) return document.getElementById('loginmsg').textContent=error.message;
 start();
}
async function start(){
 const {data:{user}}=await sb.auth.getUser(); if(!user)return;
 document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
 document.getElementById('user').textContent=user.email||'';
 await loadAll(); show('inventory');
}
async function q(table,select,opts={}){
 let x=sb.from(table).select(select);
 if(opts.order)x=x.order(opts.order,{ascending:false});
 if(opts.limit)x=x.limit(opts.limit);
 const {data,error}=await x;if(error)throw error;return data||[];
}
async function loadAll(){
 try{
  const jobs=[
   ['products',q('bp_products','id,code,product_group,name,standard_kg,min_quantity,active,updated_at')],
   ['balances',q('bp_inventory_balances','product_id,production_year,quantity,kg_quantity,reserved_quantity,updated_at')],
   ['moves',q('bp_stock_movements','id,product_id,movement_type,quantity,production_year,kg_quantity,partner,note,occurred_at',{order:'occurred_at',limit:50})],
   ['shipments',q('bp_shipment_requests','id,request_no,request_type,request_date,shipment_date,ship_from,ship_to,status,note,updated_at',{order:'request_date',limit:50})],
   ['transport',q('pi_transport_requests','id,no,request_date,carrier_name,carrier_fax,data,updated_at',{order:'request_date',limit:50})],
   ['warehouses',q('bp_warehouses','id,name,address,phone,fax,active,updated_at')],
   ['quotes',q('bp_quotes','id,quote_id,quote_date,customer,contact_person,total,status,items,pdf_path,updated_at',{order:'quote_date',limit:100})]
  ];
  const rs=await Promise.allSettled(jobs.map(x=>x[1]));
  let errors=[];
  rs.forEach((r,i)=>{if(r.status==='fulfilled')D[jobs[i][0]]=r.value;else errors.push(jobs[i][0]+': '+r.reason.message)});
  if(errors.length) console.warn('部分読込エラー',errors);
  const p=D.balances.reduce((a,b)=>a+Number(b.quantity||0),0), r=D.balances.reduce((a,b)=>a+Number(b.reserved_quantity||0),0);
  physical.textContent=p.toLocaleString()+'個';reserved.textContent=r.toLocaleString()+'個';available.textContent=(p-r).toLocaleString()+'個';
  productCount.textContent=D.products.length+'件'; synced.textContent='最終読込 '+new Date().toLocaleString('ja-JP');
 }catch(e){content.innerHTML='<div class="warn">読込エラー：'+esc(e.message)+'</div>';}
}
function pname(id){let p=D.products.find(x=>x.id===id);return p?`${p.code} ${p.name}`:''}
function calcKg(){
 const s=document.getElementById('rproduct'),q=Number(document.getElementById('rqty')?.value||0);
 if(!s)return; const kg=Number(s.options[s.selectedIndex]?.dataset.kg||0);
 document.getElementById('rkg').value=q&&kg?q*kg:'';
}
async function registerReceipt(){
 const btn=event.currentTarget,msg=document.getElementById('rmsg');
 const product=document.getElementById('rproduct').value, year=Number(document.getElementById('ryear').value),
 qty=Number(document.getElementById('rqty').value), kg=Number(document.getElementById('rkg').value||0),
 partner=document.getElementById('rpartner').value.trim(), note=document.getElementById('rnote').value.trim(),
 date=document.getElementById('rdate').value;
 if(!product||!date||!year||!Number.isFinite(qty)||qty<=0){msg.textContent='入庫日・商品・年産・個数を確認してください。';return}
 if(!confirm(`入庫を登録します。\n個数：${qty}個\n重量：${kg}kg`))return;
 btn.disabled=true;msg.textContent='登録中...';
 const {error}=await sb.rpc('bp_register_inventory_receipt',{p_product_id:product,p_production_year:year,p_quantity:qty,p_kg_quantity:kg,p_partner:partner,p_note:note,p_occurred_date:date});
 btn.disabled=false;
 if(error){msg.textContent='登録エラー：'+error.message;return}
 msg.textContent='登録しました。'; await loadAll(); show('inventory');
}
let shipItems=[];
function shipAvail(){
 const p=document.getElementById('sproduct')?.value,y=Number(document.getElementById('syear')?.value);
 const b=D.balances.find(x=>x.product_id===p&&Number(x.production_year)===y);
 const a=b?Number(b.quantity||0)-Number(b.reserved_quantity||0):0;
 const el=document.getElementById('savail');if(el)el.textContent='出荷可能在庫：'+a+'個';
}
function shipCalc(){
 const s=document.getElementById('sproduct'),q=Number(document.getElementById('sqty')?.value||0);if(!s)return;
 const kg=Number(s.options[s.selectedIndex]?.dataset.kg||0);document.getElementById('skg').value=q&&kg?q*kg:'';shipAvail();
}
function addShipItem(){
 const s=document.getElementById('sproduct'),year=Number(document.getElementById('syear').value),qty=Number(document.getElementById('sqty').value),kg=Number(document.getElementById('skg').value||0);
 if(!s.value||!year||qty<=0)return alert('商品・年産・個数を確認してください。');
 const b=D.balances.find(x=>x.product_id===s.value&&Number(x.production_year)===year),avail=b?Number(b.quantity||0)-Number(b.reserved_quantity||0):0;
 const already=shipItems.filter(x=>x.product_id===s.value&&x.production_year===year).reduce((a,x)=>a+x.quantity,0);
 if(qty+already>avail)return alert('出荷可能在庫を超えています。');
 shipItems.push({product_id:s.value,production_year:year,quantity:qty,kg_quantity:kg,source_name:s.options[s.selectedIndex].text});
 renderShipItems();
}
function renderShipItems(){
 const el=document.getElementById('sitems');if(!el)return;
 el.innerHTML=shipItems.length?'<table><tr><th>商品</th><th>年産</th><th>個数</th><th></th></tr>'+shipItems.map((x,i)=>`<tr><td>${esc(x.source_name)}</td><td>${x.production_year}</td><td>${x.quantity}</td><td><button onclick="shipItems.splice(${i},1);renderShipItems()">削除</button></td></tr>`).join('')+'</table>':'<div class="small">明細はまだありません。</div>';
}
async function saveShipment(){
 const msg=document.getElementById('smsg'),date=document.getElementById('sdate').value,to=document.getElementById('sto').value.trim();
 if(!date||!to||!shipItems.length){msg.textContent='出荷日・出荷先・商品明細を確認してください。';return}
 if(!confirm('出荷依頼を予約登録します。実在庫はまだ減りません。'))return;
 const {error}=await sb.rpc('bp_create_shipment_reservation',{p_request_type:'SHIPMENT',p_request_date:document.getElementById('sreqdate').value,p_shipment_date:date,p_ship_from:document.getElementById('sfrom').value,p_ship_to:to,p_note:document.getElementById('snote').value.trim(),p_items:shipItems});
 if(error){msg.textContent='登録エラー：'+error.message;return}
 shipItems=[];msg.textContent='予約登録しました。';await loadAll();show('shipments');
}
async function completeShipment(id){
 if(!confirm('出荷完了にします。\n予約在庫を解除し、実在庫を減算します。'))return;
 const {error}=await sb.rpc('bp_complete_shipment',{p_shipment_id:id});
 if(error){alert('出荷完了エラー：'+error.message);return}
 await loadAll();show('shipments');alert('出荷完了しました。');
}
async function cancelShipment(id){
 if(!confirm('この出荷依頼を取消します。\n実在庫は減らさず、予約在庫だけを解除します。'))return;
 const {error}=await sb.rpc('bp_cancel_shipment',{p_shipment_id:id});
 if(error){alert('取消エラー：'+error.message);return}
 await loadAll();show('shipments');alert('取消しました。');
}
function yen(v){return Number(v||0).toLocaleString('ja-JP')}
function renderQuoteList(){
 const el=document.getElementById('qlist');if(!el)return;
 const s=(document.getElementById('qsearch')?.value||'').toLowerCase();
 const a=(D.quotes||[]).filter(q=>{
   const item=(q.items||[]).map(x=>x.name||'').join(' ');
   return !s||[q.quote_id,q.customer,q.contact_person,q.status,item].join(' ').toLowerCase().includes(s);
 });
 el.innerHTML=a.length?a.map(q=>`<div class="card" style="margin:10px 0;padding:14px" onclick="quoteDetail('${q.id}')"><b>${esc(q.quote_date||'')}　${esc(q.customer||'得意先未入力')}</b><br><span class="small">${esc(q.quote_id)}　${esc(q.status||'')}　${q.total?('￥'+yen(q.total)):''}</span></div>`).join(''):'<div class="small">該当する見積はありません。</div>';
}
function quoteDetail(id){
 const q=(D.quotes||[]).find(x=>x.id===id);if(!q)return;
 const rows=(q.items||[]).map(x=>`<tr><td>${esc(x.name||'')}</td><td>${esc(x.unit||'')}</td><td>${esc(x.count||'')}</td><td>${esc(x.quantity||'')}</td><td>${esc(x.unitPrice||'')}</td><td>${esc(x.amount||'')}</td></tr>`).join('');
 content.innerHTML=`<button onclick="show('quotes')">← 見積一覧へ</button><h2>${esc(q.customer||'得意先未入力')}</h2>
 <div>見積番号：${esc(q.quote_id)}<br>見積日：${esc(q.quote_date||'')}<br>担当者：${esc(q.contact_person||'')}<br>状態：${esc(q.status||'')}<br>合計：${q.total?'￥'+yen(q.total):'－'}</div>
 <div style="overflow:auto"><table><tr><th>商品</th><th>単位</th><th>入数</th><th>数量</th><th>単価</th><th>金額</th></tr>${rows}</table></div>
 <div class="small">PDFは現在PC保存のため、次の段階で「PDFを見る」を追加します。</div>`;
}
async function importQuotes(){
 const f=document.getElementById('qfile')?.files?.[0],msg=document.getElementById('qmsg');if(!f){msg.textContent='quotes.jsonを選択してください。';return}
 let a;try{a=JSON.parse(await f.text())}catch(e){msg.textContent='JSONを読み込めません。';return}
 if(!Array.isArray(a)){msg.textContent='見積データ形式を確認してください。';return}
 const {data:{user}}=await sb.auth.getUser();if(!user){msg.textContent='ログインを確認してください。';return}
 const rows=a.map(x=>({owner_id:user.id,quote_id:x.quoteId,quote_date:x.quoteDate||null,customer:x.customer||'',contact_person:x.contactPerson||'',total:Number(x.total||0),status:x.status||'',xlsx_path:x.xlsxPath||'',pdf_path:x.pdfPath||'',items:Array.isArray(x.items)?x.items:[],source_data:x,created_at:x.createdAt||new Date().toISOString(),updated_at:x.updatedAt||new Date().toISOString()}));
 const {error}=await sb.from('bp_quotes').upsert(rows,{onConflict:'owner_id,quote_id'});
 if(error){msg.textContent='取込エラー：'+error.message;return}
 msg.textContent=rows.length+'件を取り込みました。';await loadAll();show('quotes');
}
function show(k){
 let h='';
 if(k==='quotes'){
  const qs=(D.quotes||[]);
  h=`<h2>見積閲覧</h2>
  <input id="qsearch" type="search" placeholder="得意先・見積番号・商品名で検索" oninput="renderQuoteList()">
  <div id="qlist"></div>
  <details style="margin-top:18px"><summary>PCの見積データを取り込む</summary>
  <div class="small">PCの quotes.json を選択すると、Supabaseへコピーします。元ファイルは変更しません。</div>
  <input id="qfile" type="file" accept=".json,application/json">
  <button onclick="importQuotes()">quotes.jsonを取り込む</button><div id="qmsg" class="small"></div></details>`;
  setTimeout(renderQuoteList,0);
 } else if(k==='inventory'){
  h='<h2>商品・在庫</h2><table><tr><th>商品</th><th>年産</th><th>実在庫</th><th>予約</th><th>出荷可能</th></tr>';
  for(const b of D.balances)h+=`<tr><td>${esc(pname(b.product_id))}</td><td>${esc(b.production_year)}</td><td>${Number(b.quantity||0)}</td><td>${Number(b.reserved_quantity||0)}</td><td>${Number(b.quantity||0)-Number(b.reserved_quantity||0)}</td></tr>`;
  h+='</table>';
 } else if(k==='receipt'){
  const opts=D.products.filter(x=>x.active).map(x=>`<option value="${x.id}" data-kg="${x.standard_kg}">${esc(x.code)} ${esc(x.name)}</option>`).join('');
  h=`<h2>入庫登録</h2>
  <div class="small">登録すると入出庫履歴と実在庫を同時に更新します。</div>
  <label>入庫日</label><input id="rdate" type="date" value="${new Date().toLocaleDateString('sv-SE')}">
  <label>商品</label><select id="rproduct" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px" onchange="calcKg()">${opts}</select>
  <label>年産</label><input id="ryear" type="number" value="${new Date().getFullYear()}">
  <label>個数</label><input id="rqty" type="number" min="1" step="1" oninput="calcKg()">
  <label>kg</label><input id="rkg" type="number" min="0" step="0.01">
  <label>相手先</label><input id="rpartner" type="text">
  <label>備考</label><input id="rnote" type="text">
  <button class="primary" onclick="registerReceipt()">入庫を登録</button><div id="rmsg" class="small"></div>`;
 } else if(k==='moves'){
  h='<h2>入出庫履歴（最新50件）</h2><table><tr><th>日付</th><th>商品</th><th>年産</th><th>個数</th><th>相手先</th></tr>';
  for(const x of D.moves)h+=`<tr><td>${esc((x.occurred_at||'').slice(0,10))}</td><td>${esc(pname(x.product_id))}</td><td>${esc(x.production_year)}</td><td>${Number(x.quantity||0)}</td><td>${esc(x.partner)}</td></tr>`; h+='</table>';
 } else if(k==='shipmentNew'){
  const opts=D.products.filter(x=>x.active).map(x=>`<option value="${x.id}" data-kg="${x.standard_kg}">${esc(x.code)} ${esc(x.name)}</option>`).join('');
  const wh=D.warehouses.map(x=>`<option>${esc(x.name)}</option>`).join('');
  h=`<h2>新規出荷依頼</h2><div class="small">確定時は実在庫を減らさず、予約在庫だけを増やします。</div>
  <label>依頼日</label><input id="sreqdate" type="date" value="${new Date().toLocaleDateString('sv-SE')}">
  <label>出荷日</label><input id="sdate" type="date">
  <label>出荷元</label><select id="sfrom" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px">${wh}</select>
  <label>出荷先</label><input id="sto" type="text">
  <label>備考</label><input id="snote" type="text">
  <hr><b>商品明細</b>
  <label>商品</label><select id="sproduct" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px" onchange="shipCalc()">${opts}</select>
  <label>年産</label><input id="syear" type="number" value="${new Date().getFullYear()}" oninput="shipAvail()">
  <div id="savail" class="small"></div>
  <label>個数</label><input id="sqty" type="number" min="1" step="1" oninput="shipCalc()">
  <label>kg</label><input id="skg" type="number" min="0" step="0.01">
  <button onclick="addShipItem()">明細に追加</button>
  <div id="sitems"></div>
  <button class="primary" onclick="saveShipment()">出荷依頼を予約登録</button><div id="smsg" class="small"></div>`;
  setTimeout(shipAvail,0);
 } else if(k==='shipments'){
  h='<h2>出荷依頼</h2><table><tr><th>出荷日</th><th>番号</th><th>出荷先</th><th>状態</th><th>操作</th></tr>';
  for(const x of D.shipments){
   const actions=x.status==='RESERVED'
    ? `<button onclick="completeShipment('${x.id}')">出荷完了</button> <button onclick="cancelShipment('${x.id}')">取消</button>`
    : '';
   h+=`<tr><td>${esc(x.shipment_date)}</td><td>${esc(x.request_no)}</td><td>${esc(x.ship_to)}</td><td>${esc(x.status)}</td><td>${actions}</td></tr>`;
  }h+='</table>';
 } else if(k==='transport'){
  h='<h2>運送依頼</h2><table><tr><th>依頼日</th><th>番号</th><th>運送会社</th><th>納品先</th></tr>';
  for(const x of D.transport)h+=`<tr><td>${esc(x.request_date)}</td><td>${esc(x.no)}</td><td>${esc(x.carrier_name)}</td><td>${esc(x.data?.deliveryName)}</td></tr>`;h+='</table>';
 } else {
  h='<h2>営業倉庫</h2>'; for(const x of D.warehouses)h+=`<div class="card"><b>${esc(x.name)}</b><br>${esc(x.address)}<br>TEL ${esc(x.phone)} / FAX ${esc(x.fax)}</div>`;
 }
 content.innerHTML=h;
}
sb.auth.getSession().then(({data})=>{if(data.session)start()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=0.6.1');
</script>
</body></html>
